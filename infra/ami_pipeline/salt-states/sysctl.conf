# High-concurrency Linux kernel network tuning for Sovereign Envoy Edge Proxies
# Handled in AMI build pipeline as described by Vasilios Syrakis

# Increase max backlog of pending socket connections
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Socket buffer sizes (read / write)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Ephemeral port range expansion
net.ipv4.ip_local_port_range = 10240 65535

# Fast TCP reuse for high-throughput reverse proxying
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Protect against SYN flooding
net.ipv4.tcp_syncookies = 1

# File descriptor table maximum
fs.file-max = 2097152
