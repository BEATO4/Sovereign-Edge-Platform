<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131b2e" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; font-size: 14px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; font-size: 11px; }
      .code { font-family: "Courier New", Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
      .green { fill: #10b981; font-weight: bold; }
      .blue { fill: #38bdf8; font-weight: bold; }
      .purple { fill: #818cf8; font-weight: bold; }
      .yellow { fill: #fbbf24; }
      .red { fill: #f87171; font-weight: bold; }
      .muted { fill: #64748b; }
      
      /* Subtle cycling animations between the 3 key phases */
      @keyframes phaseCycle {
        0%, 30% { opacity: 1; }
        33%, 97% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes phase2Cycle {
        0%, 31% { opacity: 0; }
        34%, 64% { opacity: 1; }
        67%, 100% { opacity: 0; }
      }
      @keyframes phase3Cycle {
        0%, 65% { opacity: 0; }
        68%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }
      .phase1 { animation: phaseCycle 15s infinite; }
      .phase2 { animation: phase2Cycle 15s infinite; }
      .phase3 { animation: phase3Cycle 15s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="580" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="1100" height="42" rx="12" fill="#0f172a" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="550" y="26" text-anchor="middle" class="title" fill="#cbd5e1" font-size="12">
    ⚡ Sovereign Edge Platform | Split-Screen Live Demo (Web-UI &amp; Terminal Executing demo.py)
  </text>

  <!-- ==================== LEFT HALF: WEB-UI DASHBOARD ==================== -->
  <g transform="translate(16, 52)">
    <rect width="520" height="510" rx="10" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- UI Header -->
    <rect x="14" y="14" width="492" height="36" rx="6" fill="#0b0f19" stroke="#1e293b" />
    <text x="26" y="37" class="title" font-size="13">🌐 http://localhost:3000</text>
    <rect x="360" y="21" width="134" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" />
    <text x="427" y="36" text-anchor="middle" class="green" font-size="10">● FLEET LIVE (2,000)</text>

    <!-- Metrics Cards Row -->
    <rect x="14" y="60" width="154" height="58" rx="6" fill="#0b0f19" stroke="#1e293b" />
    <text x="24" y="78" class="sub">MANAGED PROXIES</text>
    <text x="24" y="103" class="title" font-size="20">2,000</text>
    <text x="76" y="103" class="green" font-size="10">13 Regions</text>

    <rect x="182" y="60" width="154" height="58" rx="6" fill="#0b0f19" stroke="#1e293b" />
    <text x="192" y="78" class="sub">SQS TASK QUEUE</text>
    <text x="192" y="103" class="title" font-size="20">0 / 0</text>
    <text x="240" y="103" class="blue" font-size="10">In-flight: 0</text>

    <rect x="350" y="60" width="156" height="58" rx="6" fill="#0b0f19" stroke="#1e293b" />
    <text x="360" y="78" class="sub">AUTH LATENCY</text>
    <text x="360" y="103" class="title" font-size="20">&lt; 0.8ms</text>
    <text x="430" y="103" class="purple" font-size="10">Rust p99</text>

    <!-- High Level Interactive Topology -->
    <rect x="14" y="130" width="492" height="74" rx="8" fill="#070a13" stroke="#1e293b" />
    <text x="24" y="148" class="blue" font-size="11">Architecture Topology Flow</text>
    
    <rect x="24" y="158" width="68" height="34" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="58" y="174" text-anchor="middle" class="title" font-size="10">Dev CI</text>
    <text x="58" y="186" text-anchor="middle" class="muted" font-size="8">OSB Client</text>
    <text x="100" y="178" class="blue" font-size="12">➔</text>

    <rect x="110" y="158" width="76" height="34" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="148" y="174" text-anchor="middle" class="title" font-size="10">Broker</text>
    <text x="148" y="186" text-anchor="middle" class="muted" font-size="8">FastAPI+SQS</text>
    <text x="194" y="178" class="blue" font-size="12">➔</text>

    <rect x="204" y="158" width="80" height="34" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="244" y="174" text-anchor="middle" class="title" font-size="10">Sovereign</text>
    <text x="244" y="186" text-anchor="middle" class="muted" font-size="8">xDS Server</text>
    <text x="292" y="178" class="blue" font-size="12">➔</text>

    <rect x="302" y="158" width="78" height="34" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="341" y="174" text-anchor="middle" class="title" font-size="10">Envoy</text>
    <text x="341" y="186" text-anchor="middle" class="green" font-size="8">Zero Reload</text>
    <text x="388" y="178" class="blue" font-size="12">➔</text>

    <rect x="398" y="158" width="98" height="34" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="447" y="174" text-anchor="middle" class="title" font-size="10">Rust ext_authz</text>
    <text x="447" y="186" text-anchor="middle" class="purple" font-size="8">ASAP Crypto</text>

    <!-- Main Active Workspace in UI -->
    <rect x="14" y="214" width="492" height="282" rx="8" fill="#070a13" stroke="#1e293b" />
    
    <!-- UI Tabs -->
    <rect x="24" y="226" width="100" height="24" rx="4" fill="#1e293b" />
    <text x="74" y="242" text-anchor="middle" class="title" font-size="11">Clusters (CDS)</text>
    <text x="175" y="242" text-anchor="middle" class="sub" font-size="11">Routes (RDS)</text>
    <text x="275" y="242" text-anchor="middle" class="sub" font-size="11">Listeners (LDS)</text>
    
    <!-- Phase 1 UI state: Service Broker enqueuing & provisioning -->
    <g class="phase1">
      <rect x="24" y="260" width="472" height="60" rx="6" fill="#131b2e" stroke="#38bdf8" />
      <text x="36" y="280" class="blue" font-size="11">🛠️ OPEN SERVICE BROKER: Aprovisionando Jira Route</text>
      <text x="36" y="296" class="sub">PUT /v2/service_instances/inst-jira-prod -> SQS Task Queue</text>
      <text x="36" y="310" class="green" font-size="10">✓ 202 Accepted | Worker asignó VIP 10.240.81.10 y upstream 127.0.0.1:8081</text>
    </g>

    <!-- Phase 2 UI state: Sovereign xDS Dynamic Update without restart -->
    <g class="phase2">
      <rect x="24" y="260" width="472" height="60" rx="6" fill="#131b2e" stroke="#10b981" />
      <text x="36" y="280" class="green" font-size="11">🧠 SOVEREIGN xDS: Nueva versión compilada v2-daf507b5</text>
      <text x="36" y="296" class="sub">Plantillas clusters.j2, routes.j2, listeners.j2 renderizadas</text>
      <text x="36" y="310" class="blue" font-size="10">✓ Envoy actualizó en memoria 6 clusters y 3 rutas con 0ms downtime</text>
    </g>

    <!-- Phase 3 UI state: Edge Security ext_authz blocking unauthorized -->
    <g class="phase3">
      <rect x="24" y="260" width="472" height="60" rx="6" fill="#131b2e" stroke="#f87171" />
      <text x="36" y="280" class="red" font-size="11">🦀 RUST ASAP AUTH: Petición sin token interceptada en el Edge</text>
      <text x="36" y="296" class="sub">GET /jira/api/v1 -> Envoy ext_authz (Rust Sidecar)</text>
      <text x="36" y="310" class="red" font-size="10">✗ HTTP 401 Unauthorized | Backend protegido, 0 ciclos de CPU gastados</text>
    </g>

    <!-- JSON Preview in UI -->
    <text x="26" y="340" class="sub">Live Rendered Envoy xDS Snapshot (CDS):</text>
    <rect x="24" y="348" width="472" height="136" rx="6" fill="#0b0f19" stroke="#1e293b" />
    <text x="36" y="368" class="code" fill="#94a3b8">{</text>
    <text x="50" y="384" class="code"><tspan class="yellow">"version_info"</tspan>: <tspan class="green">"v2-daf507b5"</tspan>,</text>
    <text x="50" y="400" class="code"><tspan class="yellow">"cluster_name"</tspan>: <tspan class="blue">"cluster_jira"</tspan>,</text>
    <text x="50" y="416" class="code"><tspan class="yellow">"lb_policy"</tspan>: <tspan fill="#fff">"ROUND_ROBIN"</tspan>, <tspan class="yellow">"canary_weight"</tspan>: <tspan class="purple">10</tspan>,</text>
    <text x="50" y="432" class="code"><tspan class="yellow">"ext_authz_cluster"</tspan>: <tspan class="blue">"edge_auth_rust_cluster:9001"</tspan></text>
    <text x="36" y="450" class="code" fill="#94a3b8">}</text>
  </g>

  <!-- ==================== RIGHT HALF: TERMINAL CLI (demo.py) ==================== -->
  <g transform="translate(554, 52)">
    <rect width="530" height="510" rx="10" fill="#070a13" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#0f172a" />
    <text x="16" y="21" class="code" fill="#94a3b8">bash - make demo (executing demo.py)</text>

    <!-- Terminal Content Area -->
    <g transform="translate(16, 44)">
      <text x="0" y="16" class="code" fill="#38bdf8">$ make demo</text>
      <text x="0" y="32" class="code" fill="#64748b">======================================================================</text>
      <text x="0" y="48" class="code" fill="#38bdf8">  1. OPEN SERVICE BROKER: ASYNC ROUTE PROVISIONING</text>
      <text x="0" y="64" class="code" fill="#64748b">======================================================================</text>

      <!-- Key Moment 1: OSB Provisioning -->
      <g>
        <text x="0" y="84" class="code"><tspan class="yellow">[SQS Enqueued]</tspan> Message msg-c1e8 for <tspan class="blue">JIRA</tspan> (Path: /jira, Canary: 10%)</text>
        <text x="0" y="100" class="code"><tspan class="yellow">[SQS Enqueued]</tspan> Message msg-c0df for <tspan class="blue">CONFLUENCE</tspan> (Path: /confluence)</text>
        <text x="0" y="116" class="code"><tspan class="yellow">[SQS Enqueued]</tspan> Message msg-7075 for <tspan class="blue">BITBUCKET</tspan> (Path: /bitbucket, Canary: 25%)</text>
        <text x="0" y="132" class="code"><tspan class="green">[OSB-Worker]</tspan> Binding bind-jira-prod bound to inst-jira-prod</text>
        <text x="0" y="148" class="code"><tspan class="green">[SUCCESS]</tspan> All routes provisioned and committed to DynamoDB.</text>
      </g>

      <text x="0" y="170" class="code" fill="#64748b">======================================================================</text>
      <text x="0" y="186" class="code" fill="#10b981">  2. SOVEREIGN ENVOY xDS: DYNAMIC TEMPLATE RENDERING</text>
      <text x="0" y="202" class="code" fill="#64748b">======================================================================</text>

      <!-- Key Moment 2: Dynamic xDS update -->
      <g>
        <text x="0" y="222" class="code"><tspan class="green">[xDS Rendered]</tspan> Snapshot Version: <tspan class="yellow">v2-daf507b5</tspan> (6 clusters)</text>
        <text x="0" y="238" class="code">  - Cluster: <tspan class="blue">cluster_jira</tspan> -> Upstream: 127.0.0.1:8081</text>
        <text x="0" y="254" class="code">  - Cluster: <tspan class="blue">cluster_confluence</tspan> -> Upstream: 127.0.0.1:8082</text>
        <text x="0" y="270" class="code">  - Dynamic reload: <tspan class="green">Envoy updated routes with 0 dropped packets</tspan></text>
      </g>

      <text x="0" y="292" class="code" fill="#64748b">======================================================================</text>
      <text x="0" y="308" class="code" fill="#f87171">  3. EDGE SECURITY: RUST ASAP AUTH SIDECAR (ext_authz)</text>
      <text x="0" y="324" class="code" fill="#64748b">======================================================================</text>

      <!-- Key Moment 3: ASAP Auth rejection & acceptance -->
      <g>
        <text x="0" y="344" class="code"><tspan class="green">[TEST A: Valid ASAP Token]</tspan> Status: <tspan class="green">HTTP 200 OK</tspan></text>
        <text x="0" y="360" class="code">  Injected Header: X-Authenticated-Caller: jira-frontend-service</text>
        <text x="0" y="376" class="code">  Injected Header: X-Tenant-Id: tenant-prod-apac</text>
        <text x="0" y="396" class="code"><tspan class="red">[TEST B: Missing/Expired Token]</tspan> Status: <tspan class="red">HTTP 401 Unauthorized</tspan></text>
        <text x="0" y="412" class="code">  Edge Decision: <tspan class="red">Blocked at edge</tspan> (downstream backend untouched)</text>
      </g>

      <text x="0" y="438" class="code" fill="#10b981">======================================================================</text>
      <text x="0" y="454" class="code" fill="#10b981">  🎉 DEMONSTRATION COMPLETE | Dashboard: http://localhost:3000</text>
      <text x="0" y="466" class="code" fill="#10b981">======================================================================</text>
    </g>
  </g>
</svg>
