version: '3.8'

services:
  # 1. Open Service Broker (FastAPI + SQS Worker + DynamoDB store)
  service-broker:
    build:
      context: .
      dockerfile: services/service_broker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 2. Sovereign Envoy xDS Control Plane (Jinja2 Template Engine + Poller)
  sovereign-control-plane:
    build:
      context: .
      dockerfile: services/sovereign_control_plane/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      service-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 3. Rust Edge ASAP Authentication Sidecar (ext_authz)
  edge-auth-rust:
    build:
      context: ./services/edge_auth_rust
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    restart: unless-stopped

  # 4. Envoy Proxy (Data Plane)
  edge-proxy:
    image: envoyproxy/envoy:v1.30-latest
    volumes:
      - ./services/edge_proxy/envoy-dynamic.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
      - "9901:9901"
    depends_on:
      - sovereign-control-plane
      - edge-auth-rust
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9901/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 5. Upstream Atlassian Microservices
  jira-service:
    build:
      context: .
      dockerfile: services/mock_workloads/Dockerfile
    environment:
      - SERVICE_NAME=jira
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  confluence-service:
    build:
      context: .
      dockerfile: services/mock_workloads/Dockerfile
    environment:
      - SERVICE_NAME=confluence
      - PORT=8082
    ports:
      - "8082:8082"
    restart: unless-stopped

  # 6. Interactive Visual Dashboard & Orchestrator Portal
  dashboard:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - service-broker
      - sovereign-control-plane
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/state')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
