[package]
name = "edge-auth-rust"
version = "0.1.0"
edition = "2021"
authors = ["Vasilios Syrakis Architecture Reproduction <platform@atlassian.internal>"]
description = "High-performance Rust Envoy ext_authz sidecar for ASAP token validation"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
rsa = { version = "0.9", features = ["pem"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
